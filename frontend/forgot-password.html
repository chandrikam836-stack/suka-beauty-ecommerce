<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suka Beauty – Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<script src="js/api.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --pink:#e8748a; --dark:#2d1f24; --muted:#9a7a82; --light:#fff8f9; --white:#fff; }
  body { font-family:'Nunito',sans-serif; background:var(--light); min-height:100vh; display:flex; flex-direction:column; }
  nav { background:var(--white); padding:16px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #fce8ec; }
  .logo { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; color:var(--pink); text-decoration:none; }
  .page { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card { background:var(--white); border-radius:20px; padding:44px; width:100%; max-width:420px; box-shadow:0 6px 28px rgba(232,116,138,.13); text-align:center; }
  .icon { font-size:2.8rem; margin-bottom:10px; }
  h1 { font-family:'Playfair Display',serif; font-size:1.6rem; color:var(--dark); margin-bottom:8px; }
  p.sub { font-size:0.85rem; color:var(--muted); margin-bottom:24px; }
  .field { margin-bottom:18px; text-align:left; }
  .field input { width:100%; padding:12px 16px; border:2px solid #fce8ec; border-radius:12px; font-size:0.9rem; background:var(--light); outline:none; }
  .field input:focus { border-color:var(--pink); background:#fff; }
  .btn { width:100%; padding:13px; background:var(--pink); color:#fff; border:none; border-radius:25px; font-size:0.92rem; font-weight:800; cursor:pointer; }
  .btn:hover { background:#d45f75; }
  .footer-txt { margin-top:18px; font-size:0.82rem; color:var(--muted); }
  .footer-txt a { color:var(--pink); font-weight:700; text-decoration:none; }
</style>
</head>
<body>

<nav>
  <a href="Home.html" class="logo">Suka Beauty 💋</a>
  <a href="login.html" style="font-size:0.82rem; color:var(--muted); text-decoration:none;">← Back to Login</a>
</nav>

<div class="page">
  <div class="card">
    <div class="icon">🔑</div>
    <h1>Forgot Password?</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <div class="field">
      <input type="email" id="fpEmail" placeholder="you@example.com"/>
    </div>
    <button class="btn" id="fpBtn" onclick="doForgot()">Send Reset Link →</button>
    <p class="footer-txt">Remembered it? <a href="login.html">Login here</a></p>
  </div>
</div>

<script>
  async function doForgot() {
    const email = document.getElementById('fpEmail').value.trim();
    if (!email || !email.includes('@')) { sbToast('Enter a valid email', true); return; }
    const btn = document.getElementById('fpBtn');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const data = await AuthAPI.forgotPassword({ email });
      sbToast(data.message || 'Check your email for the reset link');
    } catch (err) {
      sbToast(err.message || 'Something went wrong', true);
    } finally {
      btn.disabled = false; btn.textContent = 'Send Reset Link →';
    }
  }
</script>

</body>
</html>
